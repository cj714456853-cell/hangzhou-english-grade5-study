<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五年级上册英语学习站 · 2025新人教PEP</title><style>
:root{--blue:#3157c8;--ink:#17223b;--muted:#64708a;--line:#dce2ef;--pale:#f3f6ff;--gold:#ffb84d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:#f7f9fe}button,select{font:inherit}button{cursor:pointer}header{padding:22px 5%;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:25px;font-weight:850;color:var(--blue)}.edition{font-size:14px;color:var(--muted)}main{max-width:1180px;margin:auto;padding:34px 24px 60px}.hero{background:linear-gradient(135deg,#274ab0,#4c6de1);color:white;padding:36px;border-radius:24px;display:flex;justify-content:space-between;align-items:end;gap:24px;box-shadow:0 15px 40px #3157c825}.hero h1{font-size:38px;margin:0 0 10px}.hero p{margin:0;opacity:.88;line-height:1.8}.progress{min-width:210px;text-align:right}.progress strong{font-size:28px}.bar{height:8px;background:#ffffff3b;border-radius:10px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);width:0}.controls{display:flex;gap:12px;align-items:center;margin:26px 0;flex-wrap:wrap}.tabs{display:flex;gap:8px}.tabs button,.unit{border:1px solid var(--line);background:white;border-radius:10px;padding:11px 16px;color:var(--ink)}.tabs button.active{background:var(--blue);color:white;border-color:var(--blue)}.unit{margin-left:auto}.section-title{margin:30px 0 15px}.section-title h2{font-size:24px;margin:0}.section-title p{color:var(--muted);margin:7px 0 0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;min-height:176px;position:relative;box-shadow:0 2px 8px #1d2f6310}.card .en{font-size:25px;font-weight:800;padding-right:44px}.card .phonetic{color:var(--blue);font-size:14px;margin:7px 0}.card .cn{color:var(--muted);font-size:17px}.speak{position:absolute;right:15px;top:15px;width:38px;height:38px;border:0;border-radius:50%;background:var(--pale);color:var(--blue);font-size:18px}.speak:hover,.speak.playing{background:var(--blue);color:white}.mark{position:absolute;right:15px;bottom:14px;border:1px solid var(--line);background:white;border-radius:8px;padding:6px 10px;color:var(--muted);font-size:13px}.mark.done{background:#e9f8f0;color:#16714b;border-color:#bde3ce}.sentence-list{display:grid;gap:13px}.sentence{background:white;border:1px solid var(--line);border-radius:16px;padding:20px 70px 20px 20px;position:relative}.sentence .en{font-size:20px;font-weight:720;line-height:1.55}.sentence .cn{color:var(--muted);margin-top:8px}.sentence .note{font-size:13px;color:var(--blue);background:var(--pale);display:inline-block;margin-top:10px;padding:6px 9px;border-radius:6px}.sentence .speak{top:20px}.empty{padding:50px;text-align:center;color:var(--muted)}.tip{margin-top:28px;color:var(--muted);font-size:13px;line-height:1.8}.footer-actions{display:flex;gap:10px;margin-top:20px}.footer-actions button{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:8px;color:var(--muted)}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.hero{align-items:start;flex-direction:column}.progress{text-align:left;width:100%}.unit{margin-left:0}}@media(max-width:520px){header{padding:18px 20px}.brand{font-size:20px}.edition{font-size:11px;text-align:right}main{padding:22px 16px 45px}.hero{padding:25px 22px;border-radius:18px}.hero h1{font-size:28px}.cards{grid-template-columns:1fr}.controls{align-items:stretch}.tabs{width:100%}.tabs button{flex:1}.unit{width:100%}.card{min-height:154px}.sentence{padding-right:62px}}
</style></head><body><header><div class="brand">English 点读学习站</div><div class="edition">五年级上册 · 2025新人教PEP版</div></header><main><section class="hero"><div><h1>听一听，读一读，记得牢。</h1><p>新版6个单元核心词汇和重点句型<br>点击小喇叭点读，中文注释帮助理解</p></div><div class="progress"><strong id="count">0 / 60</strong><div>已掌握单词</div><div class="bar"><i id="bar"></i></div></div></section><div class="controls"><div class="tabs"><button class="active" data-view="words">单词学习</button><button data-view="sentences">重点句子</button></div><select class="unit" id="unit"></select></div><div id="app"></div><div class="footer-actions"><button id="random">随机抽查单词</button><button id="reset">清空掌握记录</button></div><p class="tip">点读使用手机或电脑浏览器自带的英语语音，无需下载音频。不同设备的音色可能不同；首次点击若没有声音，请确认设备未静音，并允许浏览器播放声音。标“已掌握”的记录只保存在当前浏览器。</p></main><script>
const units=[
{id:1,title:'Unit 1 Different friends',cn:'不一样的朋友',words:[['team','/tiːm/','队；组；班'],['player','/ˈpleɪə(r)/','运动员；参赛选手'],['lovely','/ˈlʌvli/','可爱的；美好的'],['clever','/ˈklevə(r)/','聪明的'],['young','/jʌŋ/','年轻的'],['hard-working','/ˌhɑːd ˈwɜːkɪŋ/','勤奋的'],['quiet','/ˈkwaɪət/','安静的'],['robot','/ˈrəʊbɒt/','机器人'],['piano','/piˈænəʊ/','钢琴'],['chess','/tʃes/','国际象棋']],sentences:[['What is your friend like?','你的朋友是什么样的人？','询问人物外貌或性格。'],['He is clever and hard-working.','他聪明又勤奋。','be动词后接形容词描述人物。'],['What can she do? She can play the piano.','她会做什么？她会弹钢琴。','can后面使用动词原形。']]},
{id:2,title:'Unit 2 My feelings',cn:'我的感受',words:[['sad','/sæd/','难过的'],['matter','/ˈmætə(r)/','事情；问题'],['project','/ˈprɒdʒekt/','项目；方案'],['agree','/əˈɡriː/','同意'],['worried','/ˈwʌrid/','担心的'],['excited','/ɪkˈsaɪtɪd/','兴奋的'],['wrong','/rɒŋ/','错误的；有问题的'],['angry','/ˈæŋɡri/','生气的'],['afraid','/əˈfreɪd/','害怕的'],['parent','/ˈpeərənt/','父亲或母亲']],sentences:[['What is the matter?','怎么了？','询问对方遇到了什么问题。'],['I am worried about the project.','我担心这个项目。','be worried about表示“担心……”。'],['Why are you excited?','你为什么兴奋？','why询问原因，答句常用because。']]},
{id:3,title:'Unit 3 Work and play',cn:'学习与玩耍',words:[['subject','/ˈsʌbdʒɪkt/','科目；学科'],['Monday','/ˈmʌndeɪ/','星期一'],['Tuesday','/ˈtjuːzdeɪ/','星期二'],['Wednesday','/ˈwenzdeɪ/','星期三'],['Thursday','/ˈθɜːzdeɪ/','星期四'],['Friday','/ˈfraɪdeɪ/','星期五'],['weekend','/ˌwiːkˈend/','周末'],['usually','/ˈjuːʒuəli/','通常'],['lesson','/ˈlesn/','课；一节课'],['visit','/ˈvɪzɪt/','看望；参观']],sentences:[['What subjects do you have on Monday?','你星期一有什么课程？','询问某天的课程安排。'],['We have English and science.','我们有英语课和科学课。','学科名称前通常不用冠词。'],['What do you usually do at the weekend?','你周末通常做什么？','usually放在实义动词前。']]},
{id:4,title:'Unit 4 Healthy habits',cn:'健康习惯',words:[['stay','/steɪ/','保持；待'],['should','/ʃʊd/','应该'],['flu','/fluː/','流感'],['exercise','/ˈeksəsaɪz/','锻炼'],['enough','/ɪˈnʌf/','足够的'],['habit','/ˈhæbɪt/','习惯'],['rest','/rest/','休息'],['check','/tʃek/','检查'],['brush','/brʌʃ/','刷'],['twice','/twaɪs/','两次']],sentences:[['You should get enough sleep.','你应该获得充足的睡眠。','should后接动词原形，用于提出建议。'],['How often do you brush your teeth?','你多久刷一次牙？','how often询问频率。'],['I brush my teeth twice a day.','我每天刷两次牙。','twice a day表示“一天两次”。']]},
{id:5,title:'Unit 5 Food we eat',cn:'我们吃的食物',words:[['hungry','/ˈhʌŋɡri/','饥饿的'],['beef','/biːf/','牛肉'],['ice cream','/ˌaɪs ˈkriːm/','冰激凌'],['dumpling','/ˈdʌmplɪŋ/','饺子；汤圆'],['tea','/tiː/','茶'],['hamburger','/ˈhæmbɜːɡə(r)/','汉堡包'],['coconut','/ˈkəʊkənʌt/','椰子'],['seed','/siːd/','种子'],['stem','/stem/','茎；梗'],['root','/ruːt/','根']],sentences:[['What would you like to eat?','你想吃什么？','would like表示“想要”，语气较礼貌。'],['I would like some beef and vegetables.','我想要一些牛肉和蔬菜。','some可修饰不可数名词或可数名词复数。'],['Different plants give us different food.','不同的植物给我们不同的食物。','different后接名词复数时表示不同种类。']]},
{id:6,title:'Unit 6 Nature and us',cn:'自然与我们',words:[['river','/ˈrɪvə(r)/','河流'],['nature','/ˈneɪtʃə(r)/','自然'],['waterfall','/ˈwɔːtəfɔːl/','瀑布'],['forest','/ˈfɒrɪst/','森林'],['mountain','/ˈmaʊntən/','高山'],['dangerous','/ˈdeɪndʒərəs/','危险的'],['umbrella','/ʌmˈbrelə/','雨伞'],['raincoat','/ˈreɪnkəʊt/','雨衣'],['fog','/fɒɡ/','雾'],['go hiking','/ɡəʊ ˈhaɪkɪŋ/','徒步旅行']],sentences:[['What can you see in the nature park?','你在自然公园里能看到什么？','in the nature park表示“在自然公园里”。'],['We can see a river and a waterfall.','我们能看到一条河和一个瀑布。','首次提到单数可数名词常用a或an。'],['Check the weather before you go hiking.','徒步旅行前查看天气。','before引导时间关系。']]}
];
const KEY='pep-english-2025-g5-v1';let mastered=new Set(JSON.parse(localStorage.getItem(KEY)||'[]')),view='words',selected='all';const app=document.querySelector('#app'),unit=document.querySelector('#unit');unit.innerHTML='<option value="all">全部单元</option>'+units.map(u=>`<option value="${u.id}">${u.title} · ${u.cn}</option>`).join('');
function safe(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function speak(text,btn){speechSynthesis.cancel();const x=new SpeechSynthesisUtterance(text);x.lang='en-US';x.rate=.82;const vs=speechSynthesis.getVoices();x.voice=vs.find(v=>/^en-(US|GB)/.test(v.lang))||vs.find(v=>v.lang.startsWith('en'))||null;btn?.classList.add('playing');x.onend=x.onerror=()=>btn?.classList.remove('playing');speechSynthesis.speak(x)}
function update(){document.querySelector('#count').textContent=`${mastered.size} / 60`;document.querySelector('#bar').style.width=(mastered.size/60*100)+'%'}
function render(){const show=selected==='all'?units:units.filter(u=>u.id==selected);app.innerHTML=show.map(u=>`<section><div class="section-title"><h2>${u.title}</h2><p>${u.cn}</p></div>${view==='words'?`<div class="cards">${u.words.map((w,i)=>{const k=u.id+'-'+i,d=mastered.has(k);return `<article class="card"><div class="en">${safe(w[0])}</div><div class="phonetic">${safe(w[1])}</div><div class="cn">${safe(w[2])}</div><button class="speak" data-say="${safe(w[0])}" aria-label="朗读 ${safe(w[0])}">🔊</button><button class="mark ${d?'done':''}" data-mark="${k}">${d?'✓ 已掌握':'标为掌握'}</button></article>`}).join('')}</div>`:`<div class="sentence-list">${u.sentences.map(s=>`<article class="sentence"><div class="en">${safe(s[0])}</div><div class="cn">${safe(s[1])}</div><div class="note">中文注释：${safe(s[2])}</div><button class="speak" data-say="${safe(s[0])}" aria-label="朗读句子">🔊</button></article>`).join('')}</div>`}</section>`).join('');document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,b));document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{mastered.has(b.dataset.mark)?mastered.delete(b.dataset.mark):mastered.add(b.dataset.mark);localStorage.setItem(KEY,JSON.stringify([...mastered]));render();update()});update()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});unit.onchange=()=>{selected=unit.value;render()};document.querySelector('#random').onclick=()=>{const u=units[Math.floor(Math.random()*units.length)],w=u.words[Math.floor(Math.random()*u.words.length)];selected=String(u.id);unit.value=selected;view='words';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view==='words'));render();const cards=[...document.querySelectorAll('.card')],card=cards.find(c=>c.querySelector('.en').textContent===w[0]);card?.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>speak(w[0],card?.querySelector('.speak')),350)};document.querySelector('#reset').onclick=()=>{if(confirm('确定清空全部掌握记录吗？')){mastered.clear();localStorage.removeItem(KEY);render()}};render();
</script></body></html>
